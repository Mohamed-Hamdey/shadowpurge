version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "mypy"
          - "flake8"
        update-types:
          - "minor"
          - "patch"
      search-dependencies:
        patterns:
          - "serpapi"
          - "google-api-python-client"
          - "httpx"
        update-types:
          - "minor"
          - "patch"
      web-dependencies:
        patterns:
          - "playwright"
          - "beautifulsoup4"
          - "lxml"
        update-types:
          - "minor"
          - "patch"
      core-dependencies:
        patterns:
          - "pydantic*"
          - "rich"
          - "questionary"
          - "httpx"
        update-types:
          - "minor"
          - "patch"