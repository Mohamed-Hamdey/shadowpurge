[project]
name = "shadowpurge"
version = "0.1.0"
description = "Open-source digital footprint removal tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ShadowPurge Team", email = "team@shadowpurge.io"}
]
keywords = ["digital footprint", "privacy", "security", "social media", "account discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.5.0",
    "questionary>=2.0.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "pydantic-settings>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
search = [
    "serpapi>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
shadowpurge = "shadowpurge.cli:main"
